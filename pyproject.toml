[project]
name = "vulnify-agent-starter"
version = "0.2.0"
description = "Starter agent whose tool calls go through Vulnify (ALLOW, REVIEW, or BLOCK) before they run."
requires-python = ">=3.9"
dependencies = [
    "vulnify==0.4.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "vulnify[cli]==0.4.2",
]

[tool.setuptools.packages.find]
include = ["starter*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["starter"]
known-third-party = ["vulnify"]
